# fly.toml app configuration file generated for agentmemory-fysm-g on 2026-06-09T11:22:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentmemory-fysm-g'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'agentmemory_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3111
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/agentmemory/livez'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
